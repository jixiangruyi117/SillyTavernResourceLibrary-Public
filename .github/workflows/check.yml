name: check

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check && pnpm lint && pnpm test && pnpm build && pnpm secret:scan && pnpm secret:scan:history

  android:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm android:sync
      - name: Compile Android debug variants
        working-directory: android
        run: bash ./gradlew :app:assembleDebug :nativeapp:assembleDebug --stacktrace --no-daemon
      - name: Run Android JVM unit tests
        working-directory: android
        run: bash ./gradlew :app:testDebugUnitTest :nativeapp:testDebugUnitTest --stacktrace --no-daemon
