name: check

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      privacy_base:
        description: Last audited commit SHA
        required: true
        type: string

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - name: Incremental privacy candidates
        env:
          AUDIT_BASE: ${{ github.event.pull_request.base.sha || github.event.before || inputs.privacy_base }}
        run: pnpm secret:scan --base "$AUDIT_BASE"

  android:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm android:sync
      - name: Compile Android debug variants
        working-directory: android
        run: bash ./gradlew :app:assembleDebug :nativeapp:assembleDebug --stacktrace --no-daemon
      - name: Run Android JVM unit tests
        working-directory: android
        run: bash ./gradlew :app:testDebugUnitTest :nativeapp:testDebugUnitTest --stacktrace --no-daemon
